[package]
name = "atoma"
version = "0.1.45"
edition = "2021"
license = "MIT"
repository = "https://github.com/yuma-seno/atoma"

[[bin]]
name = "atoma"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"

# Linux only, and only for `prctl(PR_SET_DUMPABLE)` -- see
# infra/process_protection.rs. Target-scoped so a macOS or Windows build does not
# carry it; already in the tree transitively via tokio, so the dependency graph
# does not grow.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
